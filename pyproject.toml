[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "med-vision-transformers"
version = "0.0.1"
description = "Vision transformers for medical data research"
authors = ["Mikhail Gritskikh"]
license = "MIT"
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
torch = "2.4.1"
torchvision = "0.19.1"
transformers = "4.44.0"
timm = "1.0.8"
mlflow = "2.17.0"
nibabel = "5.3.2"
pillow = "10.4.0"
numpy = "*"
pandas = "*"
pyarrow = "*"
scikit-learn = "*"
scipy = "*"
matplotlib = "*"
opencv-python = "*"
pycocotools = "*"
loguru = "*"
tqdm = "*"
typer = "*"
python-dotenv = "*"

[tool.poetry.group.dev.dependencies]
black = ">=24.0"
flake8 = ">=7.0"
isort = ">=5.12"
pre-commit = "3.8.0"
mkdocs = "*"

[tool.black]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.isort]
profile = "black"
line_length = 99
known_first_party = ["src"]
force_sort_within_sections = true

[tool.ruff.lint.isort]
known_first_party = ["src"]
force_sort_within_sections = true
